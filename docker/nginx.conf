# =============================================================================
# Nimnegah Academy — Nginx Configuration
# =============================================================================
# Setup:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g., nimnegah.com)
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Get SSL: sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#   4. Copy: sudo cp nginx.conf /etc/nginx/sites-available/nimnegah
#   5. Enable: sudo ln -sf /etc/nginx/sites-available/nimnegah /etc/nginx/sites-enabled/
#   6. Test: sudo nginx -t
#   7. Reload: sudo systemctl reload nginx
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Per-IP concurrent connection limit (protects video streaming + slow clients)
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Only send "Connection: upgrade" when the client actually requested a
# websocket upgrade. Sending it on every request defeats upstream keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Include upstream response timings so incidents are diagnosable from logs.
# Look at urt/uct when the site is slow: high values = the app (or DB) is the
# bottleneck, not Nginx.
log_format timed '$remote_addr - $request $status '
                 'rt=$request_time urt=$upstream_response_time '
                 'uht=$upstream_header_time uct=$upstream_connect_time';

# ── Recommended main nginx.conf (http context) settings ──────────────────────
# These live in /etc/nginx/nginx.conf, not in this sites file, but they matter:
#   worker_processes auto;
#   events { worker_connections 4096; multi_accept on; }
#   http   { keepalive_timeout 15; keepalive_requests 1000;
#            client_header_timeout 10s; client_body_timeout 15s; send_timeout 15s; }
# Verify with: sudo nginx -T | grep -E "worker_connections|worker_processes|keepalive_timeout"

# Upstream — Docker app service
upstream app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # SSL (Let's Encrypt — managed by certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Client body size (for media uploads)
    client_max_body_size 2G;

    # Timed access log for incident diagnosis
    access_log /var/log/nginx/access.log timed;

    # ─── Proxy to Next.js ─────────────────────────────────────────────────────

    # Main proxy
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn perip 40;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Fail fast so slow upstream requests don't pile up.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # API routes — moderate rate limit
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 20;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Video streaming — long-lived, must not buffer, cap concurrent streams
    # per IP (players open several range requests per video).
    location /api/video/ {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 20;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # Auth endpoints — strict rate limit (anti-brute-force)
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sms.ir / Zarinpal calls are bounded in-app; keep Nginx a bit above that.
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Payload admin panel
    location /admin {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Static files from disk ───────────────────────────────────────────────

    # Media files (images, thumbnails) — served directly from disk
    # Videos are blocked here; they must go through /api/video/ (enrollment-checked)
    location /media/ {
        alias /var/data/media/;
        location ~* \.(mp4|webm|mkv|avi|mov|flv|wmv|m4v)$ {
            deny all;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://app;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        proxy_pass http://app;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block dotfiles (except .well-known for certbot)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
